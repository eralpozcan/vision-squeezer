[package]
name = "vision-squeezer-py"
version = "0.2.1"
edition = "2021"
description = "Python bindings for vision-squeezer — LLM-native image optimization"
license = "Elastic-2.0"
publish = false

[lib]
name = "vision_squeezer"
crate-type = ["cdylib"]

[dependencies]
vision-squeezer = { path = ".." }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
image = "0.25"
base64 = "0.22"
