name: Python wheels

on:
  push:
    tags: ["v*"]
  # Hand-trigger only — wheels do not need to rebuild on every push to main.
  # Use the Actions UI's "Run workflow" button to invoke manually.
  workflow_dispatch:

# Cancel queued/running wheel jobs if a newer tag supersedes them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # Python 3.8 + 3.9 dropped: both are EOL and rarely used in modern
          # vision stacks. Trims the per-platform wheel count from 6 → 4.
          args: --release --out dist --manifest-path python/Cargo.toml --interpreter 3.10 3.11 3.12 3.13
          sccache: "true"
          manylinux: 2_28
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          retention-days: 14

  macos:
    runs-on: macos-latest
    # Intel macOS dropped: macos-latest is arm64 only since 2024 (Intel runs
    # would be billed at 10× and Apple has EOL'd Intel Macs). Users on Intel
    # Macs can install via Rosetta or `pip install --no-binary`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --manifest-path python/Cargo.toml
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --manifest-path python/Cargo.toml
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist
          retention-days: 14

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # PyPI publish — disabled by default. To enable:
  #   1. Create a PyPI account: https://pypi.org/account/register/
  #   2. Reserve the project name "vision-squeezer" on PyPI (push a first
  #      manual release, or contact PyPI support if the name is taken).
  #   3. Add a Trusted Publisher (no API token needed):
  #      https://pypi.org/manage/account/publishing/
  #      Owner: eralpozcan
  #      Repo:  vision-squeezer
  #      Workflow filename: python.yml
  #      Environment name: pypi
  #   4. Create a GitHub environment named "pypi" with no protection rules.
  #   5. Uncomment the job below.
