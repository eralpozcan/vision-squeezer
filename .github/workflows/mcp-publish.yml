name: MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io via mcp-publisher.
# Auth is GitHub OIDC — the io.github.eralpozcan/* namespace is proven by this
# repo's id-token, so no secret is needed. Kept separate from release.yml so a
# registry-only publish (or a re-run after a server.json fix) never has to
# re-run crates.io / npm, which reject an already-published version.
#
# Runs after Release succeeds: the registry verifies the npm version in
# server.json exists, and Release is what publishes it. Triggering on the tag
# push directly raced npm publish and failed with a 404 (v0.6.2). Even after
# Release, npm needs a minute to serve the version (v0.7.0), so wait for it.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait for the npm version to be visible
        # npm takes a minute or two to serve a fresh version; the registry validates against it.
        run: |
          V=$(jq -r '.packages[0].version' server.json)
          for i in $(seq 1 30); do
            npm view "vision-squeezer@$V" version >/dev/null 2>&1 && exit 0
            echo "vision-squeezer@$V not visible yet ($i/30)"; sleep 10
          done
          echo "vision-squeezer@$V never appeared on npm" >&2; exit 1
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
