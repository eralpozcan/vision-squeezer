[package]
name = "vision-squeezer"
version = "0.2.2"
edition = "2024"
default-run = "vision-squeezer"
description = "LLM-native image optimization middleware & MCP server. Reduces vision model token consumption by snapping to tile boundaries."
license = "Elastic-2.0"
keywords = ["llm", "vision", "mcp", "image-optimization", "tokens"]
categories = ["multimedia::images", "command-line-utilities"]
repository = "https://github.com/eralpozcan/vision-squeezer"

[dependencies]
image = { version = "0.25", features = ["avif"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3.1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[[bin]]
name = "vision-squeezer"
path = "src/main.rs"

[[bin]]
name = "vision-squeezer-mcp"
path = "src/mcp_server.rs"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
